# One lockfile at the root covers every package here, which is what ADR 0002
# asks for. `web/` is the Cloudflare Worker; the root holds the importer, the
# lookup layer and their tests.
packages:
  - web
onlyBuiltDependencies:
  - esbuild
  - workerd

# Every dependency's version lives here, once; each package.json names it as
# `catalog:`. Add a new dependency here first, then reference it.
catalog:
  # Root: the importer, the lookup layer and their tests.
  '@better-auth/drizzle-adapter': 1.7.6
  '@better-auth/stripe': 1.7.6
  better-auth: 1.7.6
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.3
  stripe: 22.6.2
  tsx: ^4.0.0
  # Shared by the root and web/.
  typescript: 5.9.3
  # web/: the Worker.
  '@base-ui/react': 1.8.0
  '@cf-wasm/resvg': 0.4.0
  '@cf-wasm/satori': 0.4.2
  '@cloudflare/vite-plugin': 1.56.0
  '@tailwindcss/vite': 4.3.3
  '@types/node': 26.6.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vinext/cloudflare': 1.0.0-beta.8
  '@vitejs/plugin-react': 6.1.1
  '@vitejs/plugin-rsc': 0.5.35
  react: 19.3.0
  react-dom: 19.3.0
  react-server-dom-webpack: 19.3.0
  tailwindcss: 4.3.3
  vinext: 1.0.0-beta.10
  vite: 8.3.0
  wrangler: 4.135.0

# The root's tests and CLIs type against Node 22, the Worker against Node 26,
# so `@types/node` is the one dependency with two versions.
catalogs:
  node22:
    '@types/node': ^22.0.0
