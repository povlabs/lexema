name: preview-marker

# Keeps one comment on each pull request naming its Preview's three sites at
# its head (ADR 0018, #244), in the blocks Fabrika's `review-ui render` reads.
# Workers Builds reports each build only as a `Workers Builds: lexema-web`
# check run from the Cloudflare app, so this runs when a check run completes.
# The steps are web/builds/previewMarkerCommand.ts's: it acts only on that
# app's successful run for an open pull request's current head, and a run for
# an older commit changes nothing.
#
# `check_run` workflows run from the default branch, so this reads `main`'s
# code, never the pull request's. It holds `GITHUB_TOKEN` alone and calls no
# Cloudflare API: ADR 0018 keeps every Cloudflare credential out of GitHub.
#
# Once the comment is written, the smoke job (#246) asks the announced sites
# for known words, the developer landing page and the API, and reports the
# result as the `preview smoke` check run on the pull request's head. A job's
# own check here lands on `main`'s commit, not the pull request's, so the
# smoke creates its check through the Checks API. Its steps are
# web/builds/previewSmokeCommand.ts's.

on:
  check_run:
    types: [completed]

permissions: {}

# One run per branch at a time; a newer build's run waits rather than races.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.check_run.check_suite.head_branch || github.event.check_run.head_sha }}
  cancel-in-progress: false

jobs:
  announce:
    name: announce the Preview
    # Every CI job's check run completes too; only Workers Builds' own starts a runner.
    if: >-
      github.event.check_run.app.slug == 'cloudflare-workers-and-pages' &&
      github.event.check_run.name == 'Workers Builds: lexema-web' &&
      github.event.check_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    outputs:
      # `{"sha":…,"pullRequests":[…]}` when a comment names the Preview at a head; empty otherwise.
      announced: ${{ steps.announce.outputs.announced }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          # package.json names pnpm, so setup-node would cache for it and fail: this job installs nothing.
          package-manager-cache: false
      # Plain node strips the TypeScript types; the script needs no install.
      - name: Announce the Preview
        id: announce
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node web/builds/previewMarker.ts

  smoke:
    name: smoke the Preview
    needs: announce
    if: needs.announce.outputs.announced != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Smoke the Preview and report the check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANNOUNCED: ${{ needs.announce.outputs.announced }}
        run: node web/builds/previewSmoke.ts
