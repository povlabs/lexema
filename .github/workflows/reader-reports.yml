name: Reader reports

# Opens one public issue per new reader report waiting in production's app
# database `lexema-app` (#631), so a report on https://lexema.fyi reaches
# someone. The steps are src/readerReport/reportIssuesCli.ts; docs/DEPLOY.md,
# "Reader report issues", lists what it reads. No agent runs this workflow.
#
# The repository is public, so its issues and this run's log are too. The read
# never selects a reader's note, visitor code or time, an issue says only
# whether a note is there, and the log holds counts and report ids only. The
# run never writes D1: it tells a sent report by the hidden marker on its
# issue, and opens at most 20 a run.

on:
  schedule:
    # Every hour, at 17 minutes past.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

# Two runs never overlap, so one never opens the other's twin.
concurrency:
  group: reader-reports
  cancel-in-progress: false

jobs:
  issues:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Holds the D1 read-only token only; never the D1 Edit token. GitHub refuses
    # the job before it starts on a branch the environment's rules do not allow.
    environment: dictionary-plan
    permissions:
      contents: read
      # Lists the reader-report issues, creates the label, opens issues.
      issues: write
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      # First, before any install, D1 read or GitHub write.
      - name: Check the D1 read token and the account id are set
        env:
          CLOUDFLARE_D1_READ_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_D1_READ_TOKEN" ]; then
            echo "::error::CLOUDFLARE_D1_READ_TOKEN is missing or empty in the dictionary-plan environment"
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is missing or empty in the dictionary-plan environment"
            missing=1
          fi
          exit "$missing"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Wrangler gets the Cloudflare token and GitHub gets GITHUB_TOKEN; the
      # script hands neither to the other.
      - name: Open one issue per new reader report
        run: pnpm run report:issues
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
