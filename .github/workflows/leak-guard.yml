name: leak-guard

# No machine-local path (/Users/<name>/..., /home/<name>/...) reaches a doc or shell
# file. Scans only the files this PR adds or edits.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: scan changed files for machine-local paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc

      - name: Scan PR diff
        env:
          BASE_REF: ${{ github.base_ref }}
          FABRIKA_GLOBAL_WARNING_DISABLED: "1"
        run: |
          set -uo pipefail
          git fetch --no-tags origin "$BASE_REF"
          if ! diff_out="$(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD")"; then
            echo "::error::could not diff origin/$BASE_REF...HEAD — refusing to report clean over nothing."
            exit 1
          fi
          changed=()
          while IFS= read -r f; do [ -n "$f" ] && changed+=("$f"); done <<< "$diff_out"
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No changed files — nothing to scan."
            exit 0
          fi
          printf 'Scanning %d changed file(s):\n' "${#changed[@]}"
          printf '  %s\n' "${changed[@]}"
          pnpm dlx @kampus/fabrika-cli@0.8.0 guard leak-guard scan "${changed[@]}"
