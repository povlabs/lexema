name: gitleaks

# Scans only the files this PR adds or edits, at HEAD. No `push: main`: there is no
# diff to read there. Fails closed on every non-zero exit.

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.21.2"
  GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba" # gitleaks_8.21.2_linux_x64.tar.gz

jobs:
  scan:
    name: scan PR files for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Install pinned gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLf -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks version

      - name: Scan changed files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -uo pipefail
          git fetch --no-tags origin "$BASE_REF"
          if ! diff_out="$(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD")"; then
            echo "::error::could not diff origin/$BASE_REF...HEAD — refusing to report clean over nothing."
            exit 1
          fi
          changed=()
          while IFS= read -r f; do [ -n "$f" ] && changed+=("$f"); done <<< "$diff_out"
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No changed files — nothing to scan."
            exit 0
          fi
          staging="$(mktemp -d)"
          for f in "${changed[@]}"; do
            mkdir -p "${staging}/$(dirname "$f")"
            cp -P -- "$f" "${staging}/${f}" || { echo "::error::could not stage ${f}"; exit 1; }
          done
          printf 'Scanning %d changed file(s):\n' "${#changed[@]}"
          printf '  %s\n' "${changed[@]}"
          if ./gitleaks dir "$staging" --config=.gitleaks.toml --no-banner --redact --exit-code 3; then
            code=0
          else
            code=$?
          fi
          case "$code" in
            0) echo "gitleaks: clean."; exit 0 ;;
            3) echo "::error::gitleaks found a secret in a file this PR adds or edits. Remove it, rotate it, never allowlist a real secret."; exit 1 ;;
            *) echo "::error::gitleaks exit ${code} — treating as fail-closed."; exit 1 ;;
          esac
