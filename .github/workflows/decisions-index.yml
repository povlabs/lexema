name: decisions-index

# The .decisions/ corpus holds no duplicate ADR number and no filename/frontmatter
# mismatch. Two branches can mint the same number without seeing each other.

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: validate the ADR corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Installs the fabrika version the pnpm-workspace.yaml catalog pins, so
      # CI runs the same guard a local `pnpm exec fabrika` runs.
      - run: pnpm install --frozen-lockfile
      - name: Validate
        env:
          FABRIKA_GLOBAL_WARNING_DISABLED: "1"
        run: pnpm exec fabrika guard decisions-index validate
