name: Dictionary plan

# The pull request plan check (#494): plans each change declaration a pull
# request adds with the pull request's own code against the shared dictionary
# D1, and holds it to its `expected` counts. Red prints the declaration with
# the counts to put in it. It only ever runs the plan-only entry, so it writes
# nothing, records no bookmark and moves no branch. `update:auto`,
# `hide:records` and `load:page-entries` read an archive and a dump from
# hueypov/lexema-data, so the plan step also gets a read-only token for that
# repository (#498). The steps
# are src/deploy/pullRequestPlan.ts; docs/DEPLOY.md lists the environment,
# secrets and variable read here (ADR 0018). The deploy still holds every
# declaration to `expected` at merge.

#
# `paths` reads the whole pull request's diff, so it alone would plan again on
# every later push. The `declarations` step also asks whether this push itself
# touched dictionary-changes/, and the plan steps skip when it did not (#521).

on:
  # `pull_request`, never `pull_request_target`: a fork's run gets no secret.
  pull_request:
    paths:
      - "dictionary-changes/**"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    # Only this repository's own branches; a fork's pull request never runs it.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # As long as the deploy's own plan job: the run may download an archive
    # and a dump.
    timeout-minutes: 60
    # Holds the D1 read-only token and a hueypov/lexema-data read-only token;
    # never the D1 Edit token or a token that writes hueypov/lexema-data.
    environment: dictionary-plan
    concurrency:
      group: dictionary-plan-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The merge commit and its first parent, the base it is planned past.
          fetch-depth: 2
          persist-credentials: false
      # A push that changes nothing under dictionary-changes/ plans nothing. Any
      # other event, or a push whose range cannot be read, plans as before.
      - id: declarations
        name: Ask whether this push touched dictionary-changes/
        env:
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -uo pipefail
          if [ "$ACTION" != "synchronize" ] || [ -z "$BEFORE" ] || [ -z "$AFTER" ]; then
            echo "A ${ACTION} event: planning."
            echo "plan=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git fetch --no-tags --depth=1 origin "$BEFORE" "$AFTER"; then
            echo "::warning::could not fetch ${BEFORE} and ${AFTER}; planning anyway."
            echo "plan=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$BEFORE" "$AFTER" -- dictionary-changes/; then
            echo "This push changes nothing under dictionary-changes/, so nothing is planned."
            echo "plan=false" >> "$GITHUB_OUTPUT"
          else
            echo "This push changes dictionary-changes/, or the diff could not be read: planning."
            echo "plan=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.declarations.outputs.plan == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - if: steps.declarations.outputs.plan == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.declarations.outputs.plan == 'true'
      - run: pnpm run deploy:dictionary --plan-only --added-since HEAD^1
        env:
          SEED_REMOTE: lexema-dictionary
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          LEXEMA_DATA_TOKEN: ${{ secrets.LEXEMA_DATA_READ_TOKEN }}
        if: steps.declarations.outputs.plan == 'true'
