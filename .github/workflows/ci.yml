name: CI

# The typecheck and the unit tests read the whole tree, so this runs on the
# merged result as well as on the pull request (.patterns/repo-wide-gates-run-on-main.md).
# A change to Markdown alone checks nothing here, so it does not start a run.
# docs/DEPLOY.md is the exception: web/test/workersBuilds.test.ts reads it.

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!**/*.md"
      - "docs/DEPLOY.md"
  pull_request:
    paths:
      - "**"
      - "!**/*.md"
      - "docs/DEPLOY.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      # The Worker's own typecheck. `wrangler types` generates from
      # wrangler.jsonc and needs no Cloudflare account.
      - run: pnpm --filter @lexema/web typecheck
