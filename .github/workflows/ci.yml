name: CI

# The typecheck and the unit tests read the whole tree, so this runs on the
# merged result as well as on the pull request (.patterns/repo-wide-gates-run-on-main.md).
# A change to Markdown alone checks nothing here, so it does not start a run.
# The Markdown files a unit test reads are the exception, and each is listed
# under both triggers: docs/DEPLOY.md (web/test/workersBuilds.test.ts) and
# docs/UPDATE_THE_DICTIONARY.md (test/update-cli-guidance.test.ts reads each
# docs/*.md that src/ names in a recovery hint). A test that reads another
# Markdown file adds it here.

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!**/*.md"
      - "docs/DEPLOY.md"
      - "docs/UPDATE_THE_DICTIONARY.md"
  pull_request:
    paths:
      - "**"
      - "!**/*.md"
      - "docs/DEPLOY.md"
      - "docs/UPDATE_THE_DICTIONARY.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      # `pnpm test` is its two suites, one after the other. The root suite
      # runs here and the web suite in `test-web`, side by side, so neither
      # waits for the other (#521).
      - run: pnpm run test:root
      # The Worker's own typecheck. `wrangler types` generates from
      # wrangler.jsonc and needs no Cloudflare account.
      - run: pnpm --filter @lexema/web typecheck

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:web
