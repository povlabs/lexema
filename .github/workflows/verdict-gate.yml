name: verdict-gate

# ADR 0006: a PR merges when every required review verdict is PASS at its current
# head. `review scope` says which classes the diff carries; `ship gate` checks the
# matching namespaces. Make this check required in branch protection.
#
# `review scope`, not `ship scope`: ship scope refuses to run in a main working
# tree (exit 33), and a CI checkout is one.
#
# Runs on pull_request only: a verdict belongs to a PR head, so there is nothing to
# gate on a push to main. `ship gate` exits 0 whether the gate is satisfied or
# blocked, so the first output line decides.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: every required verdict is PASS at head
    if: github.event_name == 'pull_request' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc

      - name: Gate
        env:
          GH_TOKEN: ${{ github.token }}
          FABRIKA_GLOBAL_WARNING_DISABLED: "1"
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          sha="$(gh pr view "$PR" --json headRefOid -q .headRefOid)"
          fabrika() { pnpm dlx @kampus/fabrika-cli@0.7.1 "$@"; }

          scope="$(fabrika review scope "$PR")"
          echo "$scope"
          require=()
          while IFS=$'\t' read -r key val _; do
            case "$key:$val" in
              class:code)          require+=(--require review-code) ;;
              class:doc)           require+=(--require review-doc) ;;
              governance:required) require+=(--require governance) ;;
            esac
          done <<< "$scope"
          if [ "${#require[@]}" -eq 0 ]; then
            echo "::error::review scope printed no class — refusing to pass an empty gate."
            exit 1
          fi

          out="$(fabrika ship gate "$PR" --sha "$sha" "${require[@]}")"
          echo "$out"
          verdict="$(printf '%s\n' "$out" | awk -F'\t' '$1=="gate"{print $2; exit}')"
          case "$verdict" in
            satisfied) echo "verdict-gate: every required verdict is PASS at ${sha}."; exit 0 ;;
            blocked)   echo "::error::verdict-gate: a required verdict is missing, stale, or FAIL at ${sha}. See the ns lines above."; exit 1 ;;
            *)         echo "::error::verdict-gate: ship gate printed no gate line — fail-closed."; exit 1 ;;
          esac
